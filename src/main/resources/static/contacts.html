<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Dashboard</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background: #f4f4f9;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 30px 20px;
      }

      .card {
        background: #ffffff;
        padding: 36px 32px;
        border-radius: 12px;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
        width: 100%;
        max-width: 820px;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 22px;
      }

      h2 {
        font-size: 24px;
        font-weight: 700;
        color: #111827;
      }

      button {
        padding: 10px 18px;
        background: #4caf50;
        color: #ffffff;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s ease;
      }

      button:hover {
        background: #43a047;
      }

      .table-wrapper {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }

      th,
      td {
        padding: 12px 14px;
        border-bottom: 1px solid #e5e7eb;
        font-size: 14px;
      }

      th {
        color: #6b7280;
        font-weight: 600;
        text-transform: uppercase;
        font-size: 12px;
        letter-spacing: 0.05em;
        background-color: #fafafa;
      }

      td {
        color: #374151;
      }

      tr:hover {
        background-color: #f9fafb;
      }

      .empty-row {
        text-align: center;
        color: #9ca3af;
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="header">
        <h2>Submissions</h2>
        <button onclick="loadContacts()">Refresh</button>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th style="width: 10%">ID</th>
              <th style="width: 25%">Name</th>
              <th style="width: 30%">Email</th>
              <th style="width: 35%">Message</th>
            </tr>
          </thead>
          <tbody id="contactsBody">
            <tr>
              <td colspan="4" class="empty-row">Loading entries...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <script>
      async function loadContacts() {
        const tbody = document.getElementById("contactsBody");
        try {
          const response = await fetch("http://localhost:8080/contacts");
          const contacts = await response.json();

          tbody.innerHTML = "";

          if (!contacts || contacts.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="empty-row">No contacts found in MySQL.</td></tr>`;
            return;
          }

          contacts.forEach((item) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td>#${item.id ?? ""}</td>
              <td style="font-weight: 500;">${item.name ?? ""}</td>
              <td>${item.email ?? ""}</td>
              <td>${item.message ?? ""}</td>
            `;
            tbody.appendChild(tr);
          });
        } catch (error) {
          console.error("Error:", error);
          tbody.innerHTML = `<tr><td colspan="4" class="empty-row" style="color: #ef4444;">Failed to load data from backend.</td></tr>`;
        }
      }

      // Automatically load submissions when page opens
      window.onload = loadContacts;
    </script>
  </body>
</html>
